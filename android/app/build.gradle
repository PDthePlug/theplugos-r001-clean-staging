apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.theplugos.cashierhub'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.theplugos.cashierhub'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Public issuer keys only. An empty map is intentional for a fresh
        // build: enrollment fails closed until release provisioning pins the
        // staged/prod issuer public key by key ID.
        def issuerKeysJson = project.findProperty('THEPLUGOS_BUNDLE_ISSUER_KEYS_JSON') ?: '{}'
        buildConfigField 'String', 'HUB_AUTHORIZATION_ISSUER_KEYS_JSON', groovy.json.JsonOutput.toJson(issuerKeysJson)

        // HTTPS endpoint base, for example
        // https://<project-ref>.supabase.co/functions/v1. A blank value fails
        // closed; it is never inferred from a browser Supabase configuration.
        def cloudFunctionsBaseUrl = project.findProperty('THEPLUGOS_CLOUD_FUNCTIONS_BASE_URL') ?: ''
        buildConfigField 'String', 'HUB_CLOUD_FUNCTIONS_BASE_URL', groovy.json.JsonOutput.toJson(cloudFunctionsBaseUrl)
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Capacitor Android 8.5 compiles its native bridge with Java 21.
        // Keeping the app host at the same toolchain prevents a clean sync
        // from compiling the bridge and this plugin against incompatible APIs.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // SQLCipher Android Community Edition: encrypted local Hub ledger.
    implementation(group: 'net.zetetic', name: 'sqlcipher-android', version: '4.17.0')
    implementation(group: 'androidx.sqlite', name: 'sqlite', version: '2.6.2')

    // TLS is mandatory before the local server is started. The library only
    // implements RFC 6455 framing; authentication is enforced by Hub code.
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'
